server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/miniarcade_auth
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:kJ8mP3vN7qR2wX5yB9zT4cF6hL1nQ0aE8sU+iY/jW=Hd2xV3rK5pZ7tM9bN4cQ6w}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}